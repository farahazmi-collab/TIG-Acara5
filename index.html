<!DOCTYPE html>
<html>
<head>
 <title>Geospatial Mashup</title>
 <link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <script
 src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <style>
 #map { width: 100%; height: 600px; }
 </style>
</head>
<body>
 <div id="map"></div>
 <script>
 // --- Inisialisasi Peta ---
 var mymap = L.map('map').setView([48.91182806122856, 2.3056806251804858], 6);

 // --- Basemap OpenStreetMap ---
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
 maxZoom: 19,
 attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">' +
 'OpenStreetMap</a> contributors'
 }).addTo(mymap);

 // --- Marker (Objek Titik 1) ---
 var marker1 = L.marker([48.91182806122856, 2.3056806251804858]).addTo(mymap);
 marker1.bindPopup('<b>Lokasi A</b>');

 // --- Marker (Objek Titik 2) ---
 var marker2 = L.marker([47.32915555825829, 5.051970863034114]).addTo(mymap);
 marker2.bindPopup('<b>Lokasi B</b>');

 // --- Circle ---
 var circle = L.circle([48.91182806122856, 2.3056806251804858], {
 color: '#FF1493', fillColor: '#FFC0CB',
 fillOpacity: 0.5, radius: 200000
 }).addTo(mymap);
 circle.bindPopup('Radius 200 m');

 // --- Polygon ---
var polygon = L.polygon([
 [48.11325588142557, -1.6798836907215957],
 [47.21467808459195, -1.5639085927197982],
 [47.47673791050781, -0.5647772793394381],
 [47.26281920600013, -0.08132373335593002],
 [47.39390411121411, 0.6791900687760233],
 [48.009854546541476, 0.18934679684323896],
 [48.07018303711058, -0.7839258752995022],
 [48.11325588142557, -1.6798836907215957]
]).addTo(mymap);
polygon.bindPopup('Area Kawasan');


 // --- Polyline ---
 var polyline = L.polyline([
 [46.55022315595983, 0.3149073315796045],
 [45.846715378704374, 1.2431310780127092],
 [45.788466256027505, 3.1250205413884373],
 [44.9638982503306, 4.870139365433573],
 [45.75836054194903, 4.833582051487326]
 ]).addTo(mymap);
 polyline.bindPopup('Jalur');

 </script>
</body>
</html>
